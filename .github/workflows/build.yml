name: DocPaw-OFDH 构建与验证
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    name: 验证 ${{ matrix.os }} / Java ${{ matrix.runtime }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        runtime: ['8', '17', '21']
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
      - name: 准备测试运行时
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.runtime }}
      - name: 记录测试运行时路径
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "TEST_JAVA=$JAVA_HOME/bin/java.exe" >> "$GITHUB_ENV"
          else
            echo "TEST_JAVA=$JAVA_HOME/bin/java" >> "$GITHUB_ENV"
          fi
      - name: 准备构建工具链
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 构建并验证
        shell: bash
        run: mvn -B -ntp install "-Djvm=$TEST_JAVA"
      - name: 验证独立 SDK 接入
        shell: bash
        run: mvn -B -ntp -f examples/java-sdk/pom.xml verify "-Djvm=$TEST_JAVA"
      - name: 审计发行依赖
        if: matrix.os == 'ubuntu-latest' && matrix.runtime == '21'
        shell: pwsh
        run: ./tools/audit-dependencies.ps1
      - name: 准备发行工具
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 收集制品与校验和
        run: python tools/collect-release.py
      - name: 上传发行包
        uses: actions/upload-artifact@v4
        with:
          name: DocPaw-OFDH-${{ matrix.os }}-java${{ matrix.runtime }}
          if-no-files-found: error
          path: dist/ofdh-*/*
      - name: 保存依赖审计结果
        if: always() && matrix.os == 'ubuntu-latest' && matrix.runtime == '21'
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          if-no-files-found: warn
          path: target/dependency-audit.json
  contracts:
    name: 契约与发布文件检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
      - name: 准备校验工具
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-validation.txt
      - name: 安装契约校验依赖
        run: python -m pip install -r tools/requirements-validation.txt
      - name: 校验请求和报告契约
        run: python tools/validate-design.py
      - name: 验证发布工具
        run: python -m unittest discover -s tools/tests -p 'test_*.py'
      - name: 检查公开文件与错误码目录
        run: python tools/check-publication.py
